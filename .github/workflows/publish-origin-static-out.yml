name: Publish Origin static out release
on:
  workflow_dispatch:
  push:
    branches: [publish/origin-static-out]
    paths:
      - ".github/workflows/publish-origin-static-out.yml"
      - ".release-staging/SOURCE_URL.txt"
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download static export tarball
        run: |
          set -euo pipefail
          URL=$(tr -d '[:space:]' < .release-staging/SOURCE_URL.txt)
          EXPECTED=$(tr -d '[:space:]' < .release-staging/SHA256.txt)
          curl -fsSL --retry 5 --retry-delay 2 -o capycoffee-out.tar.gz "$URL"
          echo "${EXPECTED}  capycoffee-out.tar.gz" | sha256sum -c
          tar -tzf capycoffee-out.tar.gz | grep -E '(^|./)index\.html$' >/dev/null
          tar -tzf capycoffee-out.tar.gz | grep '_next/static' >/dev/null
      - name: Create GitHub Release with asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(tr -d '[:space:]' < .release-staging/RELEASE_TAG.txt)
          TITLE=$(tr -d '\n' < .release-staging/RELEASE_TITLE.txt)
          NOTES=$(cat .release-staging/RELEASE_NOTES.md)
          gh release delete "$TAG" --repo thanakijwanavit/capycoffee-web --yes 2>/dev/null || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/thanakijwanavit/capycoffee-web.git" ":refs/tags/${TAG}" 2>/dev/null || true
          gh release create "$TAG" capycoffee-out.tar.gz \
            --repo thanakijwanavit/capycoffee-web \
            --title "$TITLE" \
            --notes "$NOTES"
