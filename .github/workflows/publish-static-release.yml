name: Publish static export

on:
  push:
    paths:
      - "artifacts/READY"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-static-export
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode zip and overlay site
        id: pack
        run: |
          set -euo pipefail
          TAG=$(tr -d '[:space:]' < RELEASE_TAG)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cat artifacts/out.zip.b64.part* > /tmp/out.b64
          base64 -d /tmp/out.b64 > /tmp/out.zip
          SUM=$(sha256sum /tmp/out.zip | awk '{print $1}')
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
          echo "SHA256 $SUM"
          mkdir -p /tmp/site
          unzip -o /tmp/out.zip -d /tmp/site
          test -f /tmp/site/index.html
          rm -f about.html order.html roasts.html
          rm -rf css js assets
          rsync -a /tmp/site/ ./
          cp /tmp/out.zip ./out.zip

      - name: Commit unzipped site to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site file changes to commit"
          else
            git commit -m "Publish Next.js static export $(tr -d '[:space:]' < RELEASE_TAG) (keep infra/)"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release with out.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(tr -d '[:space:]' < RELEASE_TAG)
          SHA=$(sha256sum out.zip | awk '{print $1}')
          NOTES="Static Next.js export for S3/CDN sync.\n\nSHA256 \`${SHA}\`\n\nExtract layout: \`index.html\` at archive root (contents of \`out/\`, not an \`out/\` wrapper).\n\nProduct in this build:\n- Freebird origin: Chiang Mai, Thailand\n- Roast profile vs roast level (continuous Light–Dark slider)\n- Whole beans only (no grind)\n\nKeep \`infra/\` on main for CloudFront/S3."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out.zip --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" out.zip \
              --title "Capycoffee static export ${TAG}" \
              --notes "$NOTES"
          fi
